<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
    W = innerWidth;
    H = innerHeight;
    canvas.width = W;
    canvas.height = H;
}
addEventListener("resize", resize);
resize();

/* =========================
   PLAYER
========================= */

const player = {
    x: 450,
    y: 400,
    speed: 3.5,
    width: 34,
    height: 58,
    walk: 0
};

const keys = {};

/* =========================
   MEETING ROOM
========================= */

const room = {
    x: 0,
    y: 0,
    width: 1400,
    height: 850
};

const walls = [
    {x:0,y:0,w:1400,h:30},
    {x:0,y:820,w:1400,h:30},
    {x:0,y:0,w:30,h:850},
    {x:1370,y:0,w:30,h:850}
];

/* =========================
   TABLE
========================= */

const table = {
    x: 450,
    y: 350,
    width: 500,
    height: 170
};

/* =========================
   CHAIRS
========================= */

const chairs = [];

for(let i = 0; i < 5; i++){
    chairs.push({
        x: 500 + i * 90,
        y: 320
    });

    chairs.push({
        x: 500 + i * 90,
        y: 550
    });
}

/* =========================
   BUTTON
========================= */

const redButton = {
    x: 1160,
    y: 150,
    pressed: false
};

/* =========================
   MOVEMENT
========================= */

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function movePlayer(){

    let dx = 0;
    let dy = 0;

    if(keys["w"] || keys["arrowup"]) dy--;
    if(keys["s"] || keys["arrowdown"]) dy++;
    if(keys["a"] || keys["arrowleft"]) dx--;
    if(keys["d"] || keys["arrowright"]) dx++;

    if(dx !== 0 || dy !== 0){

        const length = Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        player.x += dx * player.speed;
        player.y += dy * player.speed;

        player.walk += 0.2;
    }

    player.x = Math.max(60, Math.min(room.width - 60, player.x));
    player.y = Math.max(80, Math.min(room.height - 60, player.y));
}

/* =========================
   DRAW ROOM
========================= */

function drawRoom(){

    // Floor
    ctx.fillStyle = "#27313b";
    ctx.fillRect(
        room.x,
        room.y,
        room.width,
        room.height
    );

    // Floor tiles
    ctx.strokeStyle = "#313d48";
    ctx.lineWidth = 1;

    for(let x = 0; x < room.width; x += 50){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,room.height);
        ctx.stroke();
    }

    for(let y = 0; y < room.height; y += 50){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(room.width,y);
        ctx.stroke();
    }

    // Walls
    ctx.fillStyle = "#4b5865";

    ctx.fillRect(0,0,1400,30);
    ctx.fillRect(0,820,1400,30);
    ctx.fillRect(0,0,30,850);
    ctx.fillRect(1370,0,30,850);

    // Back screen
    ctx.fillStyle = "#111820";
    ctx.fillRect(470,70,460,170);

    ctx.fillStyle = "#3e9be8";
    ctx.fillRect(490,90,420,130);

    ctx.fillStyle = "#dcecff";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        "SLEEPYLABS",
        700,
        160
    );

    ctx.font = "16px Arial";
    ctx.fillText(
        "LAB MEETING ROOM",
        700,
        190
    );

    // Lights
    for(let x = 150; x < 1300; x += 300){

        ctx.fillStyle = "#dcecff";
        ctx.fillRect(x,45,150,12);

    }
}

/* =========================
   DRAW TABLE
========================= */

function drawTable(){

    // Legs
    ctx.fillStyle = "#303942";

    ctx.fillRect(
        table.x + 30,
        table.y + table.height - 10,
        20,
        80
    );

    ctx.fillRect(
        table.x + table.width - 50,
        table.y + table.height - 10,
        20,
        80
    );

    // Table top
    ctx.fillStyle = "#6b7783";

    ctx.fillRect(
        table.x,
        table.y,
        table.width,
        table.height
    );

    ctx.strokeStyle = "#9ba7b3";
    ctx.lineWidth = 4;

    ctx.strokeRect(
        table.x,
        table.y,
        table.width,
        table.height
    );

    // Center display
    ctx.fillStyle = "#1b222a";

    ctx.fillRect(
        table.x + 190,
        table.y + 45,
        120,
        70
    );

    ctx.fillStyle = "#62d9ff";

    ctx.font = "14px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "LAB MAP",
        table.x + 250,
        table.y + 85
    );
}

/* =========================
   DRAW CHAIRS
========================= */

function drawChairs(){

    chairs.forEach(chair => {

        ctx.fillStyle = "#3d4854";

        ctx.fillRect(
            chair.x,
            chair.y,
            60,
            55
        );

        ctx.fillStyle = "#596674";

        ctx.fillRect(
            chair.x + 7,
            chair.y + 7,
            46,
            35
        );

    });
}

/* =========================
   RED BUTTON
========================= */

function drawButton(){

    ctx.fillStyle = "#242a31";

    ctx.fillRect(
        redButton.x - 35,
        redButton.y + 25,
        70,
        15
    );

    ctx.fillStyle =
        redButton.pressed
        ? "#58d66b"
        : "#e53935";

    ctx.beginPath();

    ctx.arc(
        redButton.x,
        redButton.y,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        redButton.pressed ? "DONE" : "PRESS",
        redButton.x,
        redButton.y + 4
    );
}

/* =========================
   ALIEN CHARACTER
========================= */

function drawAlien(){

    const x = player.x;
    const y = player.y;

    const moving =
        keys["w"] ||
        keys["a"] ||
        keys["s"] ||
        keys["d"] ||
        keys["arrowup"] ||
        keys["arrowdown"] ||
        keys["arrowleft"] ||
        keys["arrowright"];

    const swing =
        moving
        ? Math.sin(player.walk) * 7
        : 0;

    /*
       LEGS
    */

    ctx.strokeStyle = "#6fd32f";
    ctx.lineWidth = 9;
    ctx.lineCap = "round";

    // Left leg
    ctx.beginPath();

    ctx.moveTo(
        x - 9,
        y + 23
    );

    ctx.lineTo(
        x - 11 - swing,
        y + 48
    );

    ctx.stroke();

    // Right leg
    ctx.beginPath();

    ctx.moveTo(
        x + 9,
        y + 23
    );

    ctx.lineTo(
        x + 11 + swing,
        y + 48
    );

    ctx.stroke();

    /*
       FEET
    */

    ctx.lineWidth = 11;

    ctx.beginPath();

    ctx.moveTo(
        x - 12 - swing,
        y + 48
    );

    ctx.lineTo(
        x - 20 - swing,
        y + 48
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        x + 12 + swing,
        y + 48
    );

    ctx.lineTo(
        x + 20 + swing,
        y + 48
    );

    ctx.stroke();

    /*
       BODY
    */

    ctx.fillStyle = "#70d632";

    ctx.fillRect(
        x - 17,
        y - 7,
        34,
        34
    );

    /*
       ARMS
    */

    ctx.strokeStyle = "#70d632";
    ctx.lineWidth = 9;

    ctx.beginPath();

    ctx.moveTo(
        x - 17,
        y
    );

    ctx.lineTo(
        x - 28 + swing,
        y + 20
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        x + 17,
        y
    );

    ctx.lineTo(
        x + 28 - swing,
        y + 20
    );

    ctx.stroke();

    /*
       HANDS
    */

    ctx.fillStyle = "#8ae54b";

    ctx.beginPath();

    ctx.arc(
        x - 29 + swing,
        y + 21,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x + 29 - swing,
        y + 21,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       HEAD
    */

    ctx.fillStyle = "#8ae54b";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y - 28,
        25,
        28,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       EYES
    */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.ellipse(
        x - 9,
        y - 30,
        6,
        10,
        -0.2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        x + 9,
        y - 30,
        6,
        10,
        0.2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       NAME
    */

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Alien",
        x,
        y - 65
    );
}

/* =========================
   INTERACTION
========================= */

addEventListener("keydown", e => {

    if(e.key.toLowerCase() === "e"){

        const distance = Math.hypot(
            player.x - redButton.x,
            player.y - redButton.y
        );

        if(distance < 80){

            redButton.pressed = true;

            alert(
                "🔴 Red button pressed!"
            );
        }
    }
});

/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    movePlayer();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawRoom();
    drawTable();
    drawChairs();
    drawButton();
    drawAlien();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();
</script>
